name: Build SingFor10 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version | head -12
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          # setup-gradle 通常已把 gradle 加入 PATH；此处做兜底下载
          if ! command -v gradle >/dev/null 2>&1; then
            echo "gradle not on PATH, downloading distribution..."
            curl -fsSL --retry 3 -o /tmp/gradle-8.7-bin.zip \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip
            mkdir -p /opt/gradle
            unzip -q -o /tmp/gradle-8.7-bin.zip -d /opt/gradle
            export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
          fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingFor10-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
