plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.singfor10'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.singfor10"
        minSdk 23
        // 保持 34：Android 15 起禁止从 BOOT_COMPLETED 启动 mediaPlayback 类型前台服务，
        // targetSdk 34 才能在关机重启后续播（本工程为侧载，不受 Play 商店 target 要求约束）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
